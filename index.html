<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>

/* ================= BASE ================= */

:root{
  --bg:#0b1220;
  --card:#121a2b;
  --card-light:#162035;
  --border:#243150;
  --primary:#4f7cff;
  --success:#00e676;
  --warning:#ffb300;
  --danger:#ff5252;
  --info:#29b6f6;
  --purple:#c084fc;

  --text:#ffffff;
  --muted:#9aa6c3;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,Arial,sans-serif;
  background:linear-gradient(145deg,#0b1220,#0e1730);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 20px;
  background:rgba(10,15,30,.9);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.logo{height:45px}

.center{
  text-align:center;
}

.title{
  font-size:20px;
  font-weight:600;
  letter-spacing:1px;
}

#clock{
  font-size:14px;
  color:var(--muted);
  margin-top:4px;
}

.actions{
  display:flex;
  gap:8px;
}

button{
  background:var(--card-light);
  color:var(--text);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

button:hover{
  background:var(--primary);
}

/* ================= MAIN ================= */

main{
  flex:1;
  overflow:auto;
  padding:12px;
  display:grid;
  gap:12px;
}

/* ================= CARDS ================= */

.grid-top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  overflow:hidden;
}

.card header{
  padding:10px;
  text-align:center;
  font-weight:600;
  border-bottom:1px solid var(--border);
  background:var(--card-light);
}

/* ================= TABLE ================= */

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#1b2745;
}

th{
  padding:8px;
  font-size:12px;
  color:var(--muted);
}

td{
  padding:8px;
  text-align:center;
  font-size:13px;
  border-top:1px solid #1e2744;
}

tbody tr:hover{
  background:#1a2540;
}

/* ================= STATUS ================= */

.badge{
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}

.status-livre{background:#0f3d2e;color:var(--success);}
.status-ocupado{background:#3d1f1f;color:var(--danger);}
.status-manutencao{background:#1d2f4d;color:var(--info);}
.status-viagem{background:#3a2450;color:var(--purple);}

/* ================= MOBILE ================= */

@media(max-width:768px){
  .grid-top{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<header class="topbar">

  <img src="logo.png" class="logo" onerror="this.style.display='none'">

  <div class="center">
    <div class="title">MOVIMENTAÇÃO DIÁRIA</div>
    <div id="clock"></div>
  </div>

  <div class="actions">
    <button id="toggle-audio">🔊</button>
    <button id="toggle-fullscreen">⛶</button>
  </div>

</header>

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const SHEET_ID = "14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";

/* ================= HELPERS ================= */

const parseGviz = txt =>
  JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));

const getCell = c => c?.f ?? c?.v ?? "";

/* ================= FETCH ================= */

async function fetchSheet(sheet, query){

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`+
    `?sheet=${sheet}&tq=${encodeURIComponent(query)}&tqx=out:json`;

  const res = await fetch(url);
  return parseGviz(await res.text());

}

/* ================= STATUS ================= */

function statusBadge(status){

  status = status.toUpperCase();

  if(status.includes("MANUTEN"))
    return `<span class="badge status-manutencao">🔧 MANUTENÇÃO</span>`;

  if(status.includes("VIAGEM"))
    return `<span class="badge status-viagem">✈ VIAGEM</span>`;

  if(status.includes("ANDAMENTO"))
    return `<span class="badge status-ocupado">⏳ OCUPADO</span>`;

  return `<span class="badge status-livre">🟢 LIVRE</span>`;
}

/* ================= RENDER ================= */

function createTable(headers, rows){

  return `
    <table>
      <thead>
        <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${rows.map(r=>{
          const v = (r.c||[]).map(getCell);

          return `
            <tr>
              ${v.map((c,i)=>{
                if(i === v.length - 1){
                  return `<td>${statusBadge(c)}</td>`;
                }
                return `<td>${c}</td>`;
              }).join("")}
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}

/* ================= LOAD ================= */

async function load(){

  const app = document.getElementById("app");

  const [painel,agenda,veiculos,motoristas] = await Promise.all([
    fetchSheet("LANÇAMENTOS","select B,C,D,E,F,G,X"),
    fetchSheet("AGENDA DO DIA","select B,C,D,E,F,G,H"),
    fetchSheet("VEÍCULOS","select B,V,M,N"),
    fetchSheet("MOTORISTAS","select A,B,C")
  ]);

  app.innerHTML = `

    <div class="grid-top">

      <section class="card">
        <header>VEÍCULOS</header>
        ${createTable(["Placa","Status","Km","Comb."],veiculos.table.rows)}
      </section>

      <section class="card">
        <header>MOTORISTAS</header>
        ${createTable(["Nome","Status","Condição"],motoristas.table.rows)}
      </section>

    </div>

    <section class="card">
      <header>PAINEL</header>
      ${createTable(["Data","Hora","Empregado","Veículo","Descrição","Destino","Status"],painel.table.rows)}
    </section>

    <section class="card">
      <header>AGENDA</header>
      ${createTable(["Data","Hora","Passageiro","Setor","Motivo","Destino","Status"],agenda.table.rows)}
    </section>

  `;

}

/* ================= CLOCK ================= */

function updateClock(){
  document.getElementById("clock").innerText =
    new Date().toLocaleString("pt-BR");
}

setInterval(updateClock,1000);
updateClock();

/* ================= FULLSCREEN ================= */

document.getElementById("toggle-fullscreen").onclick = ()=>{
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen();
  else
    document.exitFullscreen();
};

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>

</body>
</html>
