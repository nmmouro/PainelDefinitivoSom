<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota SaaS</title>

<style>

/* ================= DESIGN SYSTEM ================= */

:root{
  --bg:#0a0f1c;
  --card:#12182b;
  --card-2:#151c33;
  --border:#1f2a46;

  --primary:#4f7cff;
  --success:#00e676;
  --warning:#ffb300;
  --danger:#ff5252;
  --info:#29b6f6;

  --text:#ffffff;
  --muted:#9aa6c3;
}

/* ================= BASE ================= */

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,Arial,sans-serif;
  background:radial-gradient(circle at top,#101935,#070b17);
  color:var(--text);
}

/* ================= HEADER ================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 22px;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.title{
  font-size:18px;
  font-weight:600;
}

.clock{
  font-size:13px;
  color:var(--muted);
}

/* ================= GRID ================= */

.container{
  padding:16px;
  display:grid;
  gap:16px;
}

/* ================= KPIs ================= */

.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.kpi{
  background:var(--card);
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
}

.kpi h4{
  color:var(--muted);
  font-size:12px;
}

.kpi .value{
  font-size:22px;
  font-weight:700;
  margin-top:6px;
}

/* ================= CARDS ================= */

.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--border);
  overflow:hidden;
}

.card header{
  padding:10px;
  background:var(--card-2);
  text-align:center;
  font-weight:600;
}

/* ================= TABLE ================= */

table{
  width:100%;
  border-collapse:collapse;
}

th{
  font-size:12px;
  color:var(--muted);
  padding:8px;
}

td{
  padding:8px;
  text-align:center;
  border-top:1px solid #202a4d;
  font-size:13px;
}

tr:hover{
  background:#182246;
}

/* ================= STATUS ================= */

.badge{
  padding:4px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}

.livre{background:#11392c;color:var(--success);}
.ocupado{background:#3c1d1d;color:var(--danger);}
.viagem{background:#2c1f4f;color:#c084fc;}
.manutencao{background:#1d2f4d;color:var(--info);}

/* ================= GRID TABLES ================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<header class="header">
  <div class="title">🚀 Painel Frota SaaS</div>
  <div id="clock" class="clock"></div>
</header>

<div class="container">

  <div id="kpis" class="kpis"></div>

  <div class="grid" id="top"></div>

  <div id="painel"></div>

</div>

<script>

/* ================= CONFIG ================= */

const SHEET_ID = "14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";

/* ================= HELPERS ================= */

const parseGviz = txt =>
  JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));

const getCell = c => c?.f ?? c?.v ?? "";

/* ================= FETCH ================= */

async function fetchSheet(sheet,query){

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`+
    `?sheet=${sheet}&tq=${encodeURIComponent(query)}&tqx=out:json`;

  const res = await fetch(url);
  return parseGviz(await res.text());
}

/* ================= STATUS ================= */

function badge(s){

  s = String(s).toUpperCase();

  if(s.includes("MANUTEN")) return `<span class="badge manutencao">🔧 MANUTENÇÃO</span>`;
  if(s.includes("VIAGEM")) return `<span class="badge viagem">✈ VIAGEM</span>`;
  if(s.includes("ANDAMENTO")) return `<span class="badge ocupado">⏳ OCUPADO</span>`;

  return `<span class="badge livre">🟢 LIVRE</span>`;
}

/* ================= TABLE ================= */

function table(headers,rows){

  return `
    <table>
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(r=>{
          const v=(r.c||[]).map(getCell);
          return `<tr>${v.map((c,i)=>`
            <td>${i === v.length-1 ? badge(c) : c}</td>
          `).join("")}</tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

/* ================= KPIs ================= */

function renderKPIs(painel){

  let livre=0,ocupado=0,manut=0,viagem=0;

  painel.forEach(r=>{
    const s = ((r.c||[]).map(getCell)[6]||"").toUpperCase();

    if(s.includes("MANUTEN")) manut++;
    else if(s.includes("VIAGEM")) viagem++;
    else if(s.includes("ANDAMENTO")) ocupado++;
    else livre++;
  });

  const el = document.getElementById("kpis");

  el.innerHTML = `
    <div class="kpi"><h4>Livres</h4><div class="value">${livre}</div></div>
    <div class="kpi"><h4>Ocupados</h4><div class="value">${ocupado}</div></div>
    <div class="kpi"><h4>Viagem</h4><div class="value">${viagem}</div></div>
    <div class="kpi"><h4>Manutenção</h4><div class="value">${manut}</div></div>
  `;
}

/* ================= LOAD ================= */

async function load(){

  const [painel,veiculos,motoristas] = await Promise.all([
    fetchSheet("LANÇAMENTOS","select B,C,D,E,F,G,X"),
    fetchSheet("VEÍCULOS","select B,V,M,N"),
    fetchSheet("MOTORISTAS","select A,B,C")
  ]);

  const painelRows = painel.table.rows || [];

  renderKPIs(painelRows);

  document.getElementById("top").innerHTML = `

    <div class="card">
      <header>VEÍCULOS</header>
      ${table(["Placa","Status","Km","Comb."],veiculos.table.rows)}
    </div>

    <div class="card">
      <header>MOTORISTAS</header>
      ${table(["Nome","Status","Condição"],motoristas.table.rows)}
    </div>
  `;

  document.getElementById("painel").innerHTML = `
    <div class="card">
      <header>PAINEL OPERACIONAL</header>
      ${table(["Data","Hora","Empregado","Veículo","Descrição","Destino","Status"],painelRows)}
    </div>
  `;
}

/* ================= CLOCK ================= */

setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleString("pt-BR");
},1000);

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>

</body>
</html>
