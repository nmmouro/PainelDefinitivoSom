<script>

/* ================= CONFIG ================= */

const SHEET_ID = "14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";

/* ================= HELPERS ================= */

const parseGviz = txt =>
  JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));

const getCell = c => c?.f ?? c?.v ?? "";

/* ================= FETCH ================= */

async function fetchSheet(sheet,query){

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`+
    `?sheet=${sheet}&tq=${encodeURIComponent(query)}&tqx=out:json`;

  const res = await fetch(url);
  return parseGviz(await res.text());
}

/* ================= STATUS ================= */

function isStatusValido(s){
  s = String(s).toUpperCase();

  return (
    s.includes("MANUTEN") ||
    s.includes("VIAGEM") ||
    s.includes("OCUPADO")
  );
}

function badge(s){

  s = String(s).toUpperCase();

  if(s.includes("MANUTEN")) return `<span class="badge manutencao">🔧 MANUTENÇÃO</span>`;
  if(s.includes("VIAGEM")) return `<span class="badge viagem">✈ VIAGEM</span>`;
  if(s.includes("OCUPADO")) return `<span class="badge ocupado">⏳ OCUPADO</span>`;

  return "";
}

/* ================= OCUPAÇÃO ================= */

function getPlacasOcupadas(painelRows){
  const set = new Set();

  painelRows.forEach(r=>{
    const v = (r.c || []).map(getCell);
    const placa = String(v[3] || "").toUpperCase().trim();

    if(placa) set.add(placa);
  });

  return set;
}

function getMotoristasOcupados(painelRows){
  const set = new Set();

  painelRows.forEach(r=>{
    const v = (r.c || []).map(getCell);
    const nome = String(v[2] || "").toUpperCase().trim();

    if(nome) set.add(nome);
  });

  return set;
}

/* ================= TABLE PADRÃO ================= */

function table(headers,rows){

  return `
    <table>
      <thead>
        <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${rows.map(r=>{
          const v=(r.c||[]).map(getCell);

          return `<tr>
            ${v.map((c,i)=>`
              <td>${i === v.length-1 ? badge(c) : c}</td>
            `).join("")}
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

/* ================= VEÍCULOS ================= */

function tableVeiculos(headers, rows, placasOcupadas){

  return `
    <table>
      <thead>
        <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${rows.map(r=>{
          const v = (r.c || []).map(getCell);

          const placa = String(v[0] || "");
          const placaNorm = placa.toUpperCase().trim();

          let status = String(v[1] || "");

          if (placasOcupadas.has(placaNorm)) {
            status = "OCUPADO";
          }

          return `<tr>
            <td>${placa}</td>
            <td>${status}</td>
            <td>${v[2]}</td>
            <td>${v[3]}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

/* ================= MOTORISTAS ================= */

function tableMotoristas(headers, rows, motoristasOcupados){

  return `
    <table>
      <thead>
        <tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${rows.map(r=>{
          const v = (r.c || []).map(getCell);

          const nome = String(v[0] || "");
          const nomeNorm = nome.toUpperCase().trim();

          let status = String(v[1] || "");

          if (motoristasOcupados.has(nomeNorm)) {
            status = "OCUPADO";
          }

          return `<tr>
            <td>${nome}</td>
            <td>${status}</td>
            <td>${v[2]}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
}

/* ================= KPIs ================= */

function renderKPIs(painel){

  let livre=0,ocupado=0,manut=0,viagem=0;

  painel.forEach(r=>{
    const s = ((r.c||[]).map(getCell)[6]||"").toUpperCase();

    if(s.includes("MANUTEN")) manut++;
    else if(s.includes("VIAGEM")) viagem++;
    else if(s.includes("OCUPADO")) ocupado++;
    else livre++;
  });

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><h4>Livres</h4><div class="value">${livre}</div></div>
    <div class="kpi"><h4>Ocupados</h4><div class="value">${ocupado}</div></div>
    <div class="kpi"><h4>Viagem</h4><div class="value">${viagem}</div></div>
    <div class="kpi"><h4>Manutenção</h4><div class="value">${manut}</div></div>
  `;
}

/* ================= LOAD ================= */

async function load(){

  const [painel,veiculos,motoristas,agenda,agendass] = await Promise.all([

    fetchSheet(
      "LANÇAMENTOS",
      "select B,C,D,E,F,G,X " +
      "where X contains 'MANUTEN' " +
      "or X contains 'VIAGEM' " +
      "or X contains 'ANDAMENTO'"
    ),

    fetchSheet("VEÍCULOS","select B,V,M,N"),
    fetchSheet("MOTORISTAS","select A,B,C"),
    fetchSheet("AGENDA DO DIA","select B,C,D,E,F,G,H"),
    fetchSheet("AGENDA SERVIÇO SOCIAL","select B,C,D,F,G,H")
  ]);

  const painelRows = (painel.table.rows || []).filter(r=>{
    const v = (r.c || []).map(getCell);
    return isStatusValido(v[6]);
  });

  const placasOcupadas = getPlacasOcupadas(painelRows);
  const motoristasOcupados = getMotoristasOcupados(painelRows);

  renderKPIs(painelRows);

  document.getElementById("top").innerHTML = `
    <div class="card">
      <header>VEÍCULOS</header>
      ${tableVeiculos(["Placa","Status","Km","Comb."],veiculos.table.rows,placasOcupadas)}
    </div>

    <div class="card">
      <header>MOTORISTAS</header>
      ${tableMotoristas(["Nome","Status","Condição"],motoristas.table.rows,motoristasOcupados)}
    </div>
  `;

  document.getElementById("painel").innerHTML = `
    <div class="card">
      <header>PAINEL OPERACIONAL</header>
      ${table(["Data","Hora","Empregado","Veículo","Passageiro/Setor/Motivo","Itinerário","Status"],painelRows)}
    </div>
  `;

  document.getElementById("agenda").innerHTML = `
    <div class="card">
      <header>AGENDA DO DIA</header>
      ${table(["Data","Hora","Passageiro","Setor","Motivo","Itinerário","Status"],agenda.table.rows)}
    </div>
  `;

  document.getElementById("agendass").innerHTML = `
    <div class="card">
      <header>AGENDA SERVIÇO SOCIAL</header>
      ${table(["Data","Período","Passageiro","Motivo","Itinerário","Status"],agendass.table.rows)}
    </div>
  `;
}

/* ================= CLOCK ================= */

setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleString("pt-BR");
},1000);

/* ================= INIT ================= */

load();
setInterval(load,30000);

</script>
